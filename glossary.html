  <style>
    :root {
      --purple: #5B2D8E;
      --purple-light: #7B4DB0;
      --purple-dark: #3A1A6B;
      --orange: #F5A623;
      --silver: #C8CDD4;
      --white: #ffffff;
      --card-bg: rgba(255,255,255,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--purple-dark);
      color: var(--white);
      min-height: 100vh;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

    /* HEADER */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
    }
    .page-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--orange);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--silver);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 5px 14px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--orange); border-color: var(--orange); }
    .sub {
      font-size: 0.82rem;
      color: var(--silver);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* SEARCH */
    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--silver);
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--white);
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.15s ease;
    }
    #searchInput::placeholder { color: rgba(255,255,255,0.3); }
    #searchInput:focus { outline: none; border-color: var(--orange); }

    /* TABS */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab-btn {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 5px 14px;
      background: transparent;
      color: var(--silver);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tab-btn:hover { border-color: var(--orange); color: var(--orange); }
    .tab-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--purple-dark);
    }

    /* RESULT COUNT */
    .result-count {
      font-size: 0.75rem;
      color: var(--silver);
      margin-bottom: 12px;
    }
    .result-count span { color: var(--orange); font-weight: 700; }

    /* GLOSSARY GRID */
    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    /* CARD */
    .gcard {
      background: var(--card-bg);
      border: 1px solid rgba(245,166,35,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .gcard:hover {
      border-color: rgba(245,166,35,0.45);
      transform: translateY(-2px);
    }
    .gcard-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .gcard-term-wrap { flex: 1; min-width: 0; }
    .gcard-term {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--white);
      line-height: 1.3;
    }
    .gcard-reading {
      font-size: 0.7rem;
      color: var(--silver);
      margin-top: 2px;
    }
    .han-badge {
      flex-shrink: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 8px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .han-1  { background: rgba(100,180,255,0.2); color: #8ecfff; border: 1px solid rgba(100,180,255,0.3); }
    .han-2  { background: rgba(130,255,150,0.15); color: #7effa0; border: 1px solid rgba(130,255,150,0.25); }
    .han-3  { background: rgba(255,200,80,0.18); color: #ffd060; border: 1px solid rgba(255,200,80,0.3); }
    .han-6  { background: rgba(255,140,60,0.2); color: #ffaa60; border: 1px solid rgba(255,140,60,0.3); }
    .han-ym { background: linear-gradient(135deg,rgba(255,100,100,0.25),rgba(200,80,255,0.25)); color: #ff9aff; border: 1px solid rgba(220,100,255,0.35); }
    .han-dym{ background: linear-gradient(135deg,rgba(255,80,80,0.3),rgba(255,200,0,0.3)); color: #ffe080; border: 1px solid rgba(255,180,0,0.4); }

    .gcard-desc {
      font-size: 0.8rem;
      line-height: 1.65;
      color: #D8D0E8;
    }
    .gcard-cat {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      margin-top: 2px;
    }

    /* EMPTY */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--silver);
      font-size: 0.88rem;
      padding: 48px 0;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      padding-top: 32px;
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .glossary-grid { grid-template-columns: 1fr 1fr; }
      .gcard-term { font-size: 0.95rem; }
    }
    @media (max-width: 360px) {
      .glossary-grid { grid-template-columns: 1fr; }
    }

    /* ===== POPUP（配信解説モード） ===== */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 4, 28, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .popup-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: linear-gradient(145deg, #2a1858, #1e0f48);
      border: 2px solid rgba(245,166,35,0.5);
      border-radius: 20px;
      padding: 32px 36px;
      max-width: 560px;
      width: 100%;
      position: relative;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 40px rgba(245,166,35,0.08);
    }
    .popup-overlay.show .popup-card {
      transform: scale(1) translateY(0);
    }
    .popup-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--silver);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .popup-close:hover { background: rgba(245,166,35,0.2); color: var(--orange); border-color: var(--orange); }
    .popup-term {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .popup-reading {
      font-size: 1rem;
      color: var(--orange);
      margin-bottom: 14px;
      letter-spacing: 0.06em;
    }
    .popup-badge-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .popup-cat-tag {
      font-size: 0.75rem;
      color: var(--silver);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 3px 12px;
    }
    .popup-desc {
      font-size: 1.1rem;
      line-height: 1.85;
      color: #E8E0F8;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
    }
    .popup-hint {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.25);
      text-align: right;
      margin-top: 18px;
    }
    /* カードをクリック可能に */
    .gcard { cursor: pointer; }
    @media (max-width: 560px) {
      .popup-term { font-size: 2rem; }
      .popup-card { padding: 24px 22px; }
    }
  </style>
</head>

<div class="container">

  <div class="page-header">

    <input type="text" id="searchInput" placeholder="用語を検索…（例：リーチ、ツモ、役満）">

  <div class="popup-card" id="popupCard">
    <button class="popup-close" onclick="closePopupBtn()" title="閉じる">✕</button>

<script>
// han値の意味: null=なし, '1'=1飜, '2'=2飜, '3'=3飜, '6'=6飜, 'ym'=役満, 'dym'=ダブル役満
// 食い下がりは説明文に含める
const GLOSSARY = [
  // ===== 基本用語 =====
  { term:'牌', reading:'パイ', cat:'basic', han:null, desc:'麻雀に使う136枚（+花牌など）のピース。萬子・筒子・索子・字牌の4種類がある。要はゲームのコマのこと！' },
  { term:'萬子', reading:'マンズ', cat:'basic', han:null, desc:'1〜9の漢数字が書かれた牌。一〜九の赤い字が目印。「一万・二万…九万」と読む。' },
  { term:'筒子', reading:'ピンズ', cat:'basic', han:null, desc:'1〜9の丸い円が描かれた牌。「一筒・二筒…九筒」と読む。見た目が丸くてかわいい。' },
  { term:'索子', reading:'ソーズ', cat:'basic', han:null, desc:'1〜9の竹が描かれた牌。「一索・二索…九索」と読む。1索だけ鳥の絵になってることが多い。' },
  { term:'字牌', reading:'ジハイ', cat:'basic', han:null, desc:'東・南・西・北・中・発・白の7種。数字がなく役に使いやすいが、ポン・カンしないと手が狭くなる。' },
  { term:'風牌', reading:'カゼハイ', cat:'basic', han:null, desc:'東・南・西・北の4種の字牌。自分の座席の方角（自風）と場の方角（場風）はポンすると役になる！' },
  { term:'三元牌', reading:'サンゲンパイ', cat:'basic', han:null, desc:'中・発・白の3種の字牌。1枚でも役がつくのでポンすると強い。役満の大三元もここから。' },
  { term:'ドラ', reading:'ドラ', cat:'basic', han:null, desc:'あがった時に点数が増えるボーナス牌。ドラ表示牌の次の牌がドラ。多ければ多いほど高い手になる！' },
  { term:'裏ドラ', reading:'ウラドラ', cat:'basic', han:null, desc:'リーチであがった時だけ追加でめくれるボーナス牌。配信でよく「裏乗れ〜！」と叫ぶやつ。' },
  { term:'赤ドラ', reading:'アカドラ', cat:'basic', han:null, desc:'5の牌が赤く染まった特殊牌。持っているだけで1飜分の点数になる。雀魂でもおなじみ。' },
  { term:'手牌', reading:'テハイ', cat:'basic', han:null, desc:'自分が持っている牌（通常13枚）。何を残すか・何を捨てるかが麻雀の醍醐味！' },
  { term:'山', reading:'ヤマ', cat:'basic', han:null, desc:'場に残っている牌の束（ストック）。ここから毎ターン1枚引く。山がなくなると流局。' },
  { term:'河', reading:'カワ', cat:'basic', han:null, desc:'自分が捨てた牌を並べるスペース。相手の河を読めると守備がうまくなる！' },
  { term:'配牌', reading:'ハイパイ', cat:'basic', han:null, desc:'ゲーム開始時に配られる最初の13枚。「配牌がいい！」は出だし好調のサインで思わず叫んじゃう。' },
  { term:'面子', reading:'メンツ', cat:'basic', han:null, desc:'順子・刻子・槓子の3枚（4枚）の組み合わせ。基本的に4組＋雀頭1組が揃えばあがれる。' },
  { term:'順子', reading:'シュンツ', cat:'basic', han:null, desc:'同じ種類の連続した3枚（例：3・4・5）。階段みたいな並び。ピンフはこれで作る。' },
  { term:'刻子', reading:'コウツ', cat:'basic', han:null, desc:'同じ牌3枚（例：北・北・北）。ポンで作れるが、手を開くことになる。' },
  { term:'槓子', reading:'カンツ', cat:'basic', han:null, desc:'同じ牌4枚（例：中・中・中・中）。カンして嶺上牌を引ける。ドラも増えてお得！' },
  { term:'雀頭', reading:'ジャントウ', cat:'basic', han:null, desc:'あがりに必要な「対（ペア）」の2枚。頭（アタマ）とも言う。なんでもいい2枚だけど大事な存在。' },
  { term:'親', reading:'オヤ', cat:'basic', han:null, desc:'その局の「先手番」みたいな役割。ツモあがりが高くなる代わりに、振り込んだ時の支払いも多い。' },
  { term:'子', reading:'コ', cat:'basic', han:null, desc:'親以外の3人のプレイヤー。親より点数は安いが、振り込んだ時の支払いが少なめ。' },
  { term:'東場', reading:'トンバ', cat:'basic', han:null, desc:'前半の4局（東1〜東4局）のこと。最初の4局で基本は東が親風牌になる。' },
  { term:'南場', reading:'ナンバ', cat:'basic', han:null, desc:'後半の4局（南1〜南4局）のこと。半荘戦はここで終わる。南が場風になる。' },
  { term:'本場', reading:'ホンバ', cat:'basic', han:null, desc:'連続した局の回数カウンター。本場が増えるごとに300点ずつ価値が増す。たくさん溜まると1回のあがりが大幅増点！' },
  { term:'点棒', reading:'テンボウ', cat:'basic', han:null, desc:'スコアを管理するための棒。100点・1000点・5000点・10000点の4種類。最終的に一番多い人が勝ち。' },
  { term:'供託', reading:'キョウタク', cat:'basic', han:null, desc:'場に置かれたリーチ棒やチョンボ棒のこと。次にあがった人が全部もらえる！うまくかっさらいたい。' },
  { term:'ロン', reading:'ロン', cat:'basic', han:null, desc:'他の人が捨てた牌であがること。「ロン！」と宣言して牌を見せる。捨てた人が点数を払う。' },
  { term:'ツモ', reading:'ツモ', cat:'basic', han:null, desc:'自分で山から引いた牌であがること。全員が少しずつ点数を払う。「メンゼンツモ」は役にもなる！' },
  { term:'流局', reading:'リュウキョク', cat:'basic', han:null, desc:'山の牌がなくなり誰もあがれずに局が終わること。テンパイなら点数を受け取れる。404ページでもおなじみ笑。' },
  { term:'フリテン', reading:'フリテン', cat:'basic', han:null, desc:'自分の河に待ち牌がある等、ロンであがれない状態。気づかずにいたら「あ、フリテンだ…」となる麻雀あるある。' },
  { term:'チョンボ', reading:'チョンボ', cat:'basic', han:null, desc:'不正なあがり宣言などをした時のペナルティ。満貫払いのことも。やらかすと場が凍る。' },
  { term:'振り込み', reading:'フリコミ', cat:'basic', han:null, desc:'相手のロン牌を捨ててしまうこと。放銃（ホウジュウ）とも言う。やってしまったときは「うわー！」となる。' },
  { term:'ポン', reading:'ポン', cat:'basic', han:null, desc:'他の誰かが捨てた牌を使って刻子（同じ牌3枚）を作ること。誰が捨てても鳴ける。手が開く。' },
  { term:'チー', reading:'チー', cat:'basic', han:null, desc:'左隣の人が捨てた牌を使って順子を作ること。左隣からしか鳴けないのが特徴。' },
  { term:'カン', reading:'カン', cat:'basic', han:null, desc:'同じ牌4枚を揃えて宣言すること。嶺上牌を追加で引けてドラも増える。うまく使えるとお得！' },
  { term:'暗槓', reading:'アンカン', cat:'basic', han:null, desc:'手牌の中だけで4枚揃えてカンすること。手を開かずに済む。嶺上牌も引けてドラ増加もある。' },
  { term:'嶺上牌', reading:'リンシャンパイ', cat:'basic', han:null, desc:'カン後に引く特殊な牌。この牌であがると「嶺上開花」の役がつく！配信でよく興奮するやつ。' },
  { term:'海底牌', reading:'ハイテイパイ', cat:'basic', han:null, desc:'山の最後の1枚。ここであがると「海底撈月」の役がつく。残り牌が少なくなるとドキドキ。' },

const CATS = {
  all:    'すべて',
  basic:  '🃏 基本用語',
  tenpai: '🎯 テンパイ・待ち',
  yaku:   '🏆 役一覧',
  yakuman:'⭐ 役満',
  stream: '📺 雀魂・配信用語',
};

const HAN_LABEL = { '1':'1飜', '2':'2飜', '3':'3飜', '6':'6飜', 'ym':'役満', 'dym':'ダブル役満' };

let currentCat = 'all';
let currentQ   = '';

function render() {
  const q = currentQ.trim().toLowerCase();
  const filtered = GLOSSARY.filter(item => {
    const catOk = currentCat === 'all' || item.cat === currentCat;
    const qOk   = !q || item.term.includes(q) || item.reading.toLowerCase().includes(q) || item.desc.includes(q);
    return catOk && qOk;
  });

  const count = document.getElementById('resultCount');
  count.innerHTML = `<span>${filtered.length}</span> 件表示中`;

  const grid = document.getElementById('glossaryGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">「' + escHtml(currentQ) + '」に一致する用語が見つかりませんでした🐟</div>';
    return;
  }

  grid.innerHTML = filtered.map((item, idx) => {
    const badgeCls = item.han ? `han-${item.han}` : '';
    const badge = item.han ? `<span class="han-badge ${badgeCls}">${HAN_LABEL[item.han]}</span>` : '';
    const catLabel = CATS[item.cat] || '';
    return `
      <div class="gcard" data-idx="${idx}" onclick="openPopup(filteredCache[${idx}])">
        <div class="gcard-header">
          <div class="gcard-term-wrap">
            <div class="gcard-term">${escHtml(item.term)}</div>
            <div class="gcard-reading">${escHtml(item.reading)}</div>
          </div>
          ${badge}
        </div>
        <div class="gcard-desc">${escHtml(item.desc)}</div>
        <div class="gcard-cat">${catLabel}</div>
      </div>`;
  }).join('');
  filteredCache = filtered;
}

let filteredCache = [];

// ===== ポップアップ =====
function openPopup(item) {
  const overlay = document.getElementById('popupOverlay');
  document.getElementById('popupTerm').textContent    = item.term;
  document.getElementById('popupReading').textContent = item.reading;
  document.getElementById('popupDesc').textContent    = item.desc;

  const badgeRow = document.getElementById('popupBadgeRow');
  let html = `<span class="popup-cat-tag">${CATS[item.cat] || ''}</span>`;
  if (item.han) {
    const cls = `han-${item.han}`;
    html += `<span class="han-badge ${cls}" style="font-size:0.82rem;padding:4px 12px;">${HAN_LABEL[item.han]}</span>`;
  }
  badgeRow.innerHTML = html;

  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closePopup(e) {
  // オーバーレイ自体（カード外）をクリックした時だけ閉じる
  if (e.target === document.getElementById('popupOverlay')) {
    _doClose();
  }
}

function closePopupBtn() { _doClose(); }

function _doClose() {
  document.getElementById('popupOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') _doClose();
});

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentQ = this.value;
  render();
});

document.getElementById('tabs').addEventListener('click', function(e) {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

render();
</script>
