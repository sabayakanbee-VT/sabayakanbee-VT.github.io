<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名言管理 | サバ缶管理用</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B2D8E;
      --purple-light: #7B4DB0;
      --purple-dark: #3A1A6B;
      --orange: #F5A623;
      --silver: #C8CDD4;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--purple-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { max-width: 640px; width: 100%; }
    h1 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 1.4rem; color: var(--orange); margin-bottom: 4px; }
    .sub { font-size: 0.8rem; color: var(--silver); margin-bottom: 28px; line-height: 1.6; }
    label { display: block; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--orange); margin-bottom: 6px; margin-top: 18px; text-transform: uppercase; }
    input, textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px 14px; color: var(--white); font-family: inherit; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus { outline: none; border-color: var(--orange); }
    button { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 0.95rem; border: none; border-radius: 30px; padding: 12px 28px; cursor: pointer; transition: transform 0.15s ease; }
    button:hover { transform: scale(1.03); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }
    .btn-primary { background: var(--orange); color: var(--purple-dark); width: 100%; margin-top: 24px; padding: 14px; font-size: 1rem; }
    .status { margin-top: 14px; font-size: 0.85rem; line-height: 1.6; text-align: center; min-height: 1.2em; }
    .status.success { color: #8FE3A0; }
    .status.error { color: #FF8A8A; }
    .add-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(245,166,35,0.2); border-radius: 16px; padding: 20px; margin-bottom: 32px; }
    .section-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; color: var(--orange); text-transform: uppercase; margin-bottom: 14px; }
    .quote-list { display: flex; flex-direction: column; gap: 10px; }
    .quote-item { background: rgba(255,255,255,0.05); border-left: 3px solid var(--orange); border-radius: 8px; padding: 14px 16px; }
    .quote-item.editing { border-left-color: var(--purple-light); background: rgba(123,77,176,0.15); }
    .quote-text-display { font-size: 0.95rem; line-height: 1.6; color: var(--white); }
    .quote-text-display::before { content: '「'; color: var(--orange); }
    .quote-text-display::after { content: '」'; color: var(--orange); }
    .quote-meta-display { font-size: 0.72rem; color: var(--silver); margin-top: 6px; }
    .quote-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-small { padding: 7px 18px; font-size: 0.8rem; font-weight: 700; }
    .btn-edit { background: rgba(123,77,176,0.5); color: var(--white); border: 1px solid var(--purple-light); }
    .btn-delete { background: rgba(255,80,80,0.15); color: #FF8A8A; border: 1px solid rgba(255,80,80,0.4); }
    .btn-save { background: var(--orange); color: var(--purple-dark); }
    .btn-cancel { background: rgba(255,255,255,0.08); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }
    .edit-fields { display: none; }
    .quote-item.editing .edit-fields { display: block; }
    .quote-item.editing .quote-text-display, .quote-item.editing .quote-meta-display { display: none; }
    .edit-fields textarea { margin-bottom: 8px; font-size: 0.9rem; }
    .edit-fields input { margin-bottom: 0; font-size: 0.85rem; }
    .loading, .empty { text-align: center; color: var(--silver); font-size: 0.85rem; padding: 20px 0; }
    .back-link { display: inline-block; margin-top: 28px; font-size: 0.8rem; color: var(--silver); text-decoration: none; }
    .back-link:hover { color: var(--orange); }
    #gate { position: fixed; inset: 0; background: var(--purple-dark); display: flex; align-items: center; justify-content: center; z-index: 999; }
    #gate.hidden { display: none; }
    .gate-box { max-width: 320px; width: 90%; text-align: center; }
    .gate-box h2 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 1.2rem; color: var(--orange); margin-bottom: 16px; }
    .gate-box input { text-align: center; margin-bottom: 12px; }
    .gate-error { color: #FF8A8A; font-size: 0.8rem; min-height: 1.2em; margin-top: 8px; }
    .main-content.hidden { display: none; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <h2>🔒 管理者用パスワード</h2>
      <input type="password" id="pwInput" placeholder="パスワードを入力">
      <button class="btn-primary" style="margin-top:0" onclick="checkPassword()">入る</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>
  <div class="container main-content hidden" id="mainContent">
    <h1>🀄 名言管理</h1>
    <div class="sub">追加・編集・削除ができます。サイトへの反映には少し時間がかかる場合があります。</div>
    <div class="add-card">
      <div class="section-title">➕ 新しい名言を追加</div>
      <label>名言・迷言</label>
      <textarea id="newQuote" placeholder="例：あがれる気がする！（あがれなかった）"></textarea>
      <label>日付・配信メモ</label>
      <input id="newMeta" type="text" placeholder="例：2026/06/15 配信より">
      <button class="btn-primary" id="addBtn" onclick="addQuote()">追加する</button>
      <div class="status" id="addStatus"></div>
    </div>
    <div class="section-title">📋 登録済みの名言一覧</div>
    <div class="quote-list" id="quoteList"><div class="loading">読み込み中...</div></div>
    <div class="section-title" style="margin-top:32px">🎨 ギャラリーの説明文編集</div>
    <div class="sub" style="margin-bottom:14px">
      画像は GitHub の <code>gallery</code> フォルダにアップロードしてください。<br>
      ここでは各画像に表示する説明文（誰の作品か、何の画像かなど）を編集できます。
    </div>
    <div class="quote-list" id="galleryList"><div class="loading">読み込み中...</div></div>
    <a class="back-link" href="index.html">← サイトに戻る</a>
  </div>
  <script>
    const ADMIN_PASSWORD = "sabakan2026"; // クライアント側の画面ロック用（変更推奨）
    // ⚠️ Apps Script の ADMIN_TOKEN と完全に一致させること
    const ADMIN_TOKEN = "sabakan_2026"; // ← Apps Scriptと同じ値にする

    function checkPassword() {
      const input = document.getElementById('pwInput').value;
      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem('sabakanAdminAuth', 'ok');
        document.getElementById('gate').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        loadQuotes();
        loadGalleryAdmin();
      } else {
        document.getElementById('gateError').textContent = 'パスワードが違います';
      }
    }
    document.getElementById('pwInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });
    if (sessionStorage.getItem('sabakanAdminAuth') === 'ok') {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      loadQuotes();
      loadGalleryAdmin();
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6wRJgarqFuF9T8_hxgG9lRoUy1XsXVHQSYHa7w606sYRDVkANbY5kWFdcUPqk9-_x2A/exec";

    function escapeHtml(str) {
      return (str || '').toString()
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function loadQuotes() {
      const list = document.getElementById('quoteList');
      list.innerHTML = '<div class="loading">読み込み中...</div>';
      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();
      window.handleQuotesData = function(data) {
        const quotes = data.quotes || [];
        if (quotes.length === 0) { list.innerHTML = '<div class="empty">まだ名言が登録されていません</div>'; return; }
        list.innerHTML = quotes.reverse().map(q => `
          <div class="quote-item" data-row="${q.row}">
            <div class="quote-text-display">${escapeHtml(q.quote)}</div>
            <div class="quote-meta-display">${escapeHtml(q.meta)}</div>
            <div class="edit-fields">
              <textarea class="edit-quote">${escapeHtml(q.quote)}</textarea>
              <input type="text" class="edit-meta" value="${escapeHtml(q.meta)}">
            </div>
            <div class="quote-actions">
              <button class="btn-small btn-edit edit-toggle" onclick="toggleEdit(this)">編集</button>
              <button class="btn-small btn-save save-btn" style="display:none" onclick="saveQuote(this)">保存</button>
              <button class="btn-small btn-cancel cancel-btn" style="display:none" onclick="toggleEdit(this)">キャンセル</button>
              <button class="btn-small btn-delete" onclick="deleteQuote(this)">削除</button>
            </div>
          </div>
        `).join('');
      };
      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = SCRIPT_URL + '?callback=handleQuotesData&t=' + Date.now();
      script.onerror = () => { list.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; };
      document.body.appendChild(script);
    }

    function toggleEdit(btn) {
      const item = btn.closest('.quote-item');
      item.classList.toggle('editing');
      const editing = item.classList.contains('editing');
      item.querySelector('.edit-toggle').style.display = editing ? 'none' : '';
      item.querySelector('.save-btn').style.display = editing ? '' : 'none';
      item.querySelector('.cancel-btn').style.display = editing ? '' : 'none';
    }

    async function saveQuote(btn) {
      const item = btn.closest('.quote-item');
      const row = item.dataset.row;
      const quote = item.querySelector('.edit-quote').value.trim();
      const meta = item.querySelector('.edit-meta').value.trim();
      if (!quote) { alert('名言を入力してください'); return; }
      btn.disabled = true; btn.textContent = '保存中...';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'edit', row: Number(row), quote, meta, token: ADMIN_TOKEN }) // ✅ token追加
        });
        item.querySelector('.quote-text-display').textContent = quote;
        item.querySelector('.quote-meta-display').textContent = meta;
        toggleEdit(btn);
      } catch (err) { alert('保存に失敗しました'); }
      finally { btn.disabled = false; btn.textContent = '保存'; }
    }

    async function deleteQuote(btn) {
      if (!confirm('この名言を削除しますか？')) return;
      const item = btn.closest('.quote-item');
      const row = item.dataset.row;
      btn.disabled = true; btn.textContent = '削除中...';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'delete', row: Number(row), token: ADMIN_TOKEN }) // ✅ token追加
        });
        await loadQuotes();
      } catch (err) { alert('削除に失敗しました'); btn.disabled = false; btn.textContent = '削除'; }
    }

    async function addQuote() {
      const quote = document.getElementById('newQuote').value.trim();
      const meta = document.getElementById('newMeta').value.trim();
      const btn = document.getElementById('addBtn');
      const statusEl = document.getElementById('addStatus');
      if (!quote) { alert('名言・迷言を入力してください！'); return; }
      btn.disabled = true; btn.textContent = '送信中...';
      statusEl.textContent = ''; statusEl.className = 'status';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'add', quote, meta: meta || '配信より', token: ADMIN_TOKEN }) // ✅ token追加
        });
        statusEl.textContent = '✅ 追加しました！'; statusEl.className = 'status success';
        document.getElementById('newQuote').value = '';
        document.getElementById('newMeta').value = '';
        await loadQuotes();
      } catch (err) { statusEl.textContent = '❌ 追加に失敗しました'; statusEl.className = 'status error'; }
      finally { btn.disabled = false; btn.textContent = '追加する'; }
    }

    const GALLERY_API_URL = "https://api.github.com/repos/sabayakanbee-VT/sabayakanbee-VT.github.io/contents/gallery";
    async function loadGalleryAdmin() {
      const list = document.getElementById('galleryList');
      list.innerHTML = '<div class="loading">読み込み中...</div>';
      try {
        const res = await fetch(GALLERY_API_URL);
        if (!res.ok) throw new Error('fetch failed');
        const files = await res.json();
        const images = files
          .filter(f => /\.(png|jpe?g|gif|webp)$/i.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        if (images.length === 0) { list.innerHTML = '<div class="empty">galleryフォルダに画像がありません</div>'; return; }
        window.handleGalleryAdminData = function(data) {
          const captionMap = {};
          (data.items || []).forEach(it => { captionMap[it.file] = it.caption; });
          list.innerHTML = images.map(f => `
            <div class="quote-item" data-file="${escapeHtml(f.name)}">
              <div style="display:flex; gap:12px; align-items:flex-start;">
                <img src="gallery/${f.name}" alt="${escapeHtml(f.name)}"
                     style="width:64px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0; border:1px solid rgba(255,255,255,0.1)">
                <div style="flex:1">
                  <div class="quote-meta-display" style="margin-bottom:6px">${escapeHtml(f.name)}</div>
                  <input type="text" class="caption-input" value="${escapeHtml(captionMap[f.name] || '')}"
                         placeholder="説明文（誰の作品か、何の画像かなど）">
                </div>
              </div>
              <div class="quote-actions">
                <button class="btn-small btn-save" onclick="saveCaption(this)">保存</button>
              </div>
            </div>
          `).join('');
        };
        const oldScript = document.getElementById('jsonpGalleryScript');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'jsonpGalleryScript';
        script.src = SCRIPT_URL + '?action=gallery&callback=handleGalleryAdminData&t=' + Date.now();
        script.onerror = () => { list.innerHTML = '<div class="empty">説明文の読み込みに失敗しました</div>'; };
        document.body.appendChild(script);
      } catch (err) { list.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; }
    }

    async function saveCaption(btn) {
      const item = btn.closest('.quote-item');
      const file = item.dataset.file;
      const caption = item.querySelector('.caption-input').value.trim();
      btn.disabled = true; btn.textContent = '保存中...';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'gallery-set', file, caption, token: ADMIN_TOKEN }) // ✅ token追加
        });
        btn.textContent = '保存しました！';
        setTimeout(() => { btn.textContent = '保存'; btn.disabled = false; }, 1200);
      } catch (err) { alert('保存に失敗しました'); btn.disabled = false; btn.textContent = '保存'; }
    }
  </script>
</body>
</html>
