<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名言・迷言集 | サバ缶鯖屋缶兵衛</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B2D8E;
      --purple-light: #7B4DB0;
      --purple-dark: #3A1A6B;
      --orange: #F5A623;
      --silver: #C8CDD4;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--purple-dark);
      color: var(--white);
      min-height: 100vh;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 32px 20px 60px; }

    h1 {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1.5rem;
      color: var(--orange);
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.8rem;
      color: var(--silver);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .quotes { display: flex; flex-direction: column; gap: 12px; }

    .quote-card {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .quote-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--white);
    }
    .quote-text::before { content: '「'; color: var(--orange); }
    .quote-text::after { content: '」'; color: var(--orange); }

    .quote-meta {
      font-size: 0.72rem;
      color: var(--silver);
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    .vote-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .vote-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 8px 12px;
      color: var(--white);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .vote-btn:hover {
      border-color: var(--orange);
      background: rgba(245,166,35,0.1);
    }

    .vote-btn:active { transform: scale(0.97); }

    .vote-btn.voted {
      border-color: var(--orange);
      background: rgba(245,166,35,0.15);
      color: var(--orange);
    }

    .vote-btn .count {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.9rem;
    }

    .meigen-btn .count { color: #FFD27A; }
    .meigen2-btn .count { color: #D4BAFF; }

    .loading, .empty {
      text-align: center;
      color: var(--silver);
      font-size: 0.85rem;
      padding: 40px 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--silver);
      text-decoration: none;
    }
    .back-link:hover { color: var(--orange); }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 名言・迷言集</h1>
    <div class="sub">サバ缶の配信から生まれた名言・迷言たち。「名言だ！」「迷言だ！」で投票してね🐟（投票は1ブラウザにつき1回まで）</div>

    <div class="quotes" id="quotesContainer">
      <div class="loading">読み込み中...</div>
    </div>

    <a class="back-link" href="index.html">← トップに戻る</a>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6wRJgarqFuF9T8_hxgG9lRoUy1XsXVHQSYHa7w606sYRDVkANbY5kWFdcUPqk9-_x2A/exec";

    function escapeHtml(str) {
      return (str || '').toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function votedKey(row) {
      return 'sabakan_voted_' + row;
    }

    function loadQuotes() {
      const container = document.getElementById('quotesContainer');

      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();

      window.handleQuotesData = function(data) {
        const quotes = data.quotes || [];

        if (quotes.length === 0) {
          container.innerHTML = '<div class="empty">まだ名言が登録されていません</div>';
          return;
        }

        container.innerHTML = quotes.reverse().map(q => {
          const voted = localStorage.getItem(votedKey(q.row));
          const meigenVoted = voted === 'meigen' ? 'voted' : '';
          const meigen2Voted = voted === 'meigen2' ? 'voted' : '';

          return `
          <div class="quote-card" data-row="${q.row}">
            <div class="quote-text">${escapeHtml(q.quote)}</div>
            <div class="quote-meta">${escapeHtml(q.meta)}</div>
            <div class="vote-row">
              <button class="vote-btn meigen-btn ${meigenVoted}" onclick="vote(${q.row}, 'meigen', this)">
                ✨ 名言！ <span class="count">${q.meigen}</span>
              </button>
              <button class="vote-btn meigen2-btn ${meigen2Voted}" onclick="vote(${q.row}, 'meigen2', this)">
                🤣 迷言！ <span class="count">${q.meigen2}</span>
              </button>
            </div>
          </div>`;
        }).join('');
      };

      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = SCRIPT_URL + '?callback=handleQuotesData&t=' + Date.now();
      script.onerror = function() {
        container.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
      };
      document.body.appendChild(script);
    }

    function vote(row, type, btn) {
      if (localStorage.getItem(votedKey(row))) {
        alert('この名言にはすでに投票済みです🐟');
        return;
      }

      const card = btn.closest('.quote-card');
      const countEl = btn.querySelector('.count');
      countEl.textContent = Number(countEl.textContent) + 1;
      btn.classList.add('voted');
      localStorage.setItem(votedKey(row), type);

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'vote', row: row, type: type })
      }).catch(() => {});
    }

    loadQuotes();
  </script>
</body>
</html>
